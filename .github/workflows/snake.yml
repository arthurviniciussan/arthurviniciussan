name: Generate Snake Animation

on:
  schedule:
    # Todo dia às 00:00 UTC (21:00 em Brasília no horário padrão).
    - cron: "0 0 * * *"
  # Permite rodar manualmente pela aba Actions, útil no primeiro disparo.
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      # Necessário para publicar o SVG na branch "output".
      contents: write

    steps:
      - name: Gerar os SVGs da cobrinha
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
