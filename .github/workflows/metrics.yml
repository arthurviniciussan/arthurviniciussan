name: Generate GitHub Metrics

on:
  schedule:
    # Todo dia às 03:00 UTC (meia-noite em Brasília no horário padrão).
    - cron: "0 3 * * *"
  # Necessário para o primeiro disparo, sem esperar o cron.
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      # O action comita os SVGs gerados de volta no repositório.
      contents: write

    steps:
      # O action falha com "You must provide a valid GitHub personal token" quando
      # o secret nao existe, o que nao diz onde esta o problema. Este passo troca
      # essa mensagem por uma instrucao acionavel.
      - name: Conferir o secret METRICS_TOKEN
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::O secret METRICS_TOKEN chegou vazio. Duas causas possiveis:"
            echo "::error::1) Ele nao foi criado. Crie um PAT classico em Settings do seu PERFIL > Developer settings > Personal access tokens > Tokens (classic) e salve em Settings deste REPOSITORIO > Secrets and variables > Actions > New repository secret, com o nome exato METRICS_TOKEN."
            echo "::error::2) Ele foi criado como Environment secret. Neste caso ou mova para Repository secret, ou declare o environment correspondente neste job."
            echo "::error::GITHUB_TOKEN nao substitui o PAT aqui: o action le dados de usuario, que um token com escopo de repositorio nao alcanca."
            exit 1
          fi
          echo "METRICS_TOKEN presente."

      # Card geral: perfil, atividade, repositórios.
      - name: Gerar card de estatísticas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/stats.svg
          template: classic
          base: header, activity, repositories
          config_timezone: America/Sao_Paulo
          committer_message: "chore: atualiza card de estatísticas"

      # Card de linguagens, separado para poder ficar lado a lado no README.
      - name: Gerar card de linguagens
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%
          # Marcação e config poluem a contagem sem dizer nada sobre o que eu programo.
          plugin_languages_ignored: html, css, scss, dockerfile, makefile, shell, batchfile, procfile
          config_timezone: America/Sao_Paulo
          committer_message: "chore: atualiza card de linguagens"
